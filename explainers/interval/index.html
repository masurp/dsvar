<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which whisker is it</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
  /* ==========================================================================
     Week 3 lecture explainer — SD, SE AND THE CONFIDENCE INTERVAL.

     One mean. Four things you could draw on it, on one unchanging x scale, so
     the LENGTHS are directly comparable. The room predicts each whisker before
     it is drawn; that prediction is the explainer, and it is why this is not a
     four-panel static figure. Belia, Fidler, Williams & Cumming (2005) found
     that researchers who publish in the area misplace these. Asking the room
     to commit out loud first is how that finding becomes an experience rather
     than a citation.

     THE DATA is real: the descriptive-norm measure from study 1 of Masur &
     Parry (2026), n = 589, a three-item mean on a seven-point scale. Only the
     19 level counts are embedded, which is exact — no value can fall between
     the grid points. Every statistic below is computed from them at load, so
     nothing here can drift from the deck.

     THE ORDER IS THE ARGUMENT:
       0  the mean alone. Predict the whisker. There is no whisker to predict.
       1  +/- 1 SD   the spread of PEOPLE          half width 1.71
       2  +/- 1 SE   the spread of sample MEANS    half width 0.07
       3  95% CI     SE x 1.96                     half width 0.14
       4  all three at once, over the raw data. The SD whisker is 12 times
          the CI's half width and nothing on a chart distinguishes them.

     The last step is the one that has to land: these are not three degrees of
     the same thing, they are answers to three different questions, and two of
     them are about the estimate rather than about anybody in the room.

     Click, Enter or space advances; backspace goes back; #N opens at step N.
     ?dark for the dark ground. Philipp, 2026-09-19.
     ========================================================================== */
  :root{
    --ink:#1a1a17; --ink-2:#3a3a34; --ink-3:#5a5a52; --muted:#7a7a70; --faint:#9a9a90;
    --hair:#e7e3d9; --border:#e0dcd0; --surface:#ffffff; --paper:#faf8f4;
    --accent:#1e7c50; --accent-2:#2d9e87; --bad:#b4472f; --warn:#c98a0e;
    --font:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body.dark{
    --ink:#e7ebea; --ink-2:#ccd8d6; --ink-3:#a2c5c0; --muted:#73a29b; --faint:#62928b;
    --hair:#184d47; --border:#184d47; --surface:#003732; --paper:#002a26;
    --accent:#63ba8a; --accent-2:#90d49c; --bad:#e2846a; --warn:#e0b050;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font); background:transparent; color:var(--ink);
       overflow:hidden; cursor:pointer; -webkit-tap-highlight-color:transparent;
       display:flex; flex-direction:column; user-select:none}
  .head{flex:0 0 auto; padding:13px 20px 4px; display:flex; align-items:baseline; gap:14px}
  .kick{font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--accent); text-transform:uppercase}
  .task{font-size:15px; font-weight:700}
  .hw{margin-left:auto; font-size:24px; font-weight:700; font-variant-numeric:tabular-nums;
      letter-spacing:-.02em; min-width:190px; text-align:right}
  .hw .u{font-size:12px; color:var(--muted); font-weight:500}
  .stage{flex:1 1 auto; min-height:0; position:relative}
  svg{width:100%;height:100%;display:block}
  .foot{flex:0 0 auto; padding:9px 20px 12px; border-top:1px solid var(--hair);
        display:flex; gap:16px; align-items:flex-start}
  .note{flex:1 1 auto; font-size:11.5px; line-height:1.5; color:var(--ink-3); min-height:50px}
  .note b{color:var(--ink)}
  .note .q{color:var(--warn); font-weight:700}
  .prog{flex:0 0 auto; font-size:10px; color:var(--faint); letter-spacing:.08em; align-self:center}
  .axis{stroke:var(--hair); stroke-width:1}
  .atx{fill:var(--muted); font-size:11px; text-anchor:middle}
  .lbl{fill:var(--ink-2); font-size:11.5px; font-weight:700}
  .lbl.dim{fill:var(--faint); font-weight:500}
  .val{fill:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums}
  .whisk{stroke:var(--accent); stroke-width:5; stroke-linecap:round}
  .whisk.dim{stroke:var(--faint); opacity:.5; stroke-width:3.5}
  .dot{fill:var(--ink)}
  .pt{fill:var(--muted); opacity:.35}
  .ghost{stroke:var(--hair); stroke-width:1; stroke-dasharray:2 3}
</style>
</head>
<body>
<div class="head">
  <div class="kick" id="kick">Week 3 · name the interval</div>
  <div class="task" id="task"></div>
  <div class="hw" id="hw"></div>
</div>
<div class="stage"><svg id="svg" viewBox="0 0 760 320" preserveAspectRatio="xMidYMid meet"></svg></div>
<div class="foot">
  <div class="note" id="note"></div>
  <div class="prog" id="prog"></div>
</div>
<script>
// ---------------------------------------------------------------- the data
// Masur & Parry (2026) study 1, descriptive norm, n = 589. Level counts only.
const COUNTS = [14,5,9,18,21,17,26,22,20,26,25,25,37,44,34,63,35,43,105];
const VALUES = COUNTS.map((n,k)=>({v: 1 + k/3, n: n}));
const N = COUNTS.reduce((a,b)=>a+b,0);
const MEAN = VALUES.reduce((a,d)=>a + d.v*d.n, 0) / N;
// Sample SD, n-1 in the denominator, so it matches sd() in the deck.
const SD = Math.sqrt(VALUES.reduce((a,d)=>a + d.n*Math.pow(d.v-MEAN,2), 0) / (N-1));
const SE = SD / Math.sqrt(N);
const CI = 1.9640 * SE;   // t(588) at 95%, which is 1.964, not 1.96

const STEP = [
  {kick:"Step 1", task:"A mean, with nothing on it.",
   hw:null, show:[],
   note:'The mean of 589 answers is <b>' + MEAN.toFixed(2) + '</b>. <span class="q">Before the next click: how long should the whisker be?</span> You cannot answer that, because "the whisker" is not one thing. The next three steps are three different correct answers.'},
  {kick:"Step 2", task:"± 1 standard deviation", hw:"SD", show:["sd"],
   note:'<b>The SD describes the people.</b> About two thirds of the sample lies in here. It does not get shorter if you collect more data — it is a property of the population, not of your effort. <span class="q">Predict the next one before clicking.</span>'},
  {kick:"Step 3", task:"± 1 standard error", hw:"SE", show:["sd","se"],
   note:'<b>The SE describes the estimate.</b> It is the SD divided by √' + N + ', so it is about ' + Math.round(SD/SE) + ' times shorter, and it answers a completely different question: not "where are the people" but "how well do we know the mean". Collect four times the data and it halves.'},
  {kick:"Step 4", task:"95% confidence interval", hw:"CI", show:["sd","se","ci"],
   note:'<b>The CI is the SE multiplied by 1.96.</b> So it is a little wider than the SE bar and still tiny next to the SD. Three whiskers, three questions, one mean — and a chart that draws any of them looks exactly the same.'},
  {kick:"Step 5", task:"All three, over the data they came from", hw:"ALL", show:["sd","se","ci","raw"],
   note:'<b>The SD whisker is ' + (SD/CI).toFixed(1) + ' times the CI\'s half width.</b> Same mean, same 589 people, same chart. Belia et al. (2005) found that researchers who publish in the area routinely misread which is which — and the only fix is the caption. Say which one it is, every time.'}
];

const svg = document.getElementById('svg');
const NS = "http://www.w3.org/2000/svg";
const W = 760, H = 320, L = 112, R = 118, T = 22, B = 34;
let step = 0;

function el(t,a,p){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);(p||svg).appendChild(n);return n;}
function txt(t,a,s){const n=el(t,a);n.textContent=s;return n;}

// One x scale for every step. That is the whole design: if the axis rescaled,
// the lengths would stop being comparable and the explainer would say nothing.
const XLO = 2.6, XHI = 7.45;
const x = v => L + (v - XLO) / (XHI - XLO) * (W - L - R);

const ROWS = {sd:{y:T+34, lab:"mean ± SD", hw:SD},
              se:{y:T+92, lab:"mean ± SE", hw:SE},
              ci:{y:T+150, lab:"95% CI",     hw:CI}};

function draw(){
  svg.innerHTML = '';
  const s = STEP[step], on = s.show;
  const yAx = H - B;

  el('line',{class:'ghost', x1:x(MEAN), x2:x(MEAN), y1:T, y2:yAx});

  for (const k of ["sd","se","ci"]){
    const r = ROWS[k];
    const active = on.includes(k);
    const last = on[on.length-1] === k || (k === "ci" && on.includes("raw"));
    txt('text',{class:'lbl' + (active && !last ? ' dim' : active ? '' : ' dim'),
                x:L-14, y:r.y+4, style:'text-anchor:end'},
        active ? r.lab : "");
    if (!active) continue;
    el('line',{class:'whisk' + (last ? '' : ' dim'),
               x1:x(MEAN-r.hw), x2:x(MEAN+r.hw), y1:r.y, y2:r.y});
    el('circle',{class:'dot', cx:x(MEAN), cy:r.y, r:4});
    txt('text',{class:'val', x:W-R+12, y:r.y+4},
        '± ' + r.hw.toFixed(3));
  }

  // Step 1 has no whisker at all: just the mean, so the question lands.
  if (on.length === 0){
    // Centred, not on the SD row: with one dot and nothing else, hanging it at
    // the top makes the frame look broken rather than deliberately empty.
    const yc = ROWS.se.y;
    el('circle',{class:'dot', cx:x(MEAN), cy:yc, r:5});
    txt('text',{class:'lbl', x:L-14, y:yc+4, style:'text-anchor:end'}, 'the mean');
    txt('text',{class:'val', x:W-R+12, y:yc+4}, MEAN.toFixed(3));
  }

  // The raw data, last, under everything: the thing all three summarise.
  if (on.includes("raw")){
    const yr = T + 208;
    txt('text',{class:'lbl', x:L-14, y:yr+4, style:'text-anchor:end'}, 'the data');
    let seed = 11;
    const rnd = ()=>{ seed = (seed*1664525+1013904223)>>>0; return seed/4294967296; };
    for (const d of VALUES){
      // One dot per two respondents, jittered vertically, so the ceiling pile
      // is visible as density rather than as one very tall column.
      for (let i = 0; i < Math.round(d.n/2); i++){
        if (d.v < XLO) continue;
        el('circle',{class:'pt', cx:x(d.v) + (rnd()-.5)*5, cy:yr + (rnd()-.5)*34, r:1.5});
      }
    }
  }

  el('line',{class:'axis', x1:L, x2:W-R, y1:yAx, y2:yAx});
  for (let v = 3; v <= 7; v++) txt('text',{class:'atx', x:x(v), y:yAx+17}, v);

  document.getElementById('kick').textContent = s.kick;
  document.getElementById('task').textContent = s.task;
  const hw = s.hw === "SD" ? SD : s.hw === "SE" ? SE : s.hw === "CI" ? CI : null;
  document.getElementById('hw').innerHTML = s.hw === "ALL"
    ? (SD/CI).toFixed(1) + '×<span class="u"> SD vs CI</span>'
    : hw === null ? '<span class="u">no interval</span>'
    : 'half width ' + hw.toFixed(3);
  document.getElementById('note').innerHTML = s.note;
  document.getElementById('prog').textContent = (step+1) + ' / ' + STEP.length;
  if (history.replaceState) history.replaceState(null,'','#'+(step+1));
}

function setStep(i){ step = Math.max(0, Math.min(STEP.length-1, i)); draw(); }
document.body.addEventListener('click', ()=> setStep(step >= STEP.length-1 ? 0 : step+1));
document.addEventListener('keydown', e=>{
  if (e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault();
    setStep(step >= STEP.length-1 ? 0 : step+1); }
  if (e.key==='ArrowLeft'||e.key==='Backspace'){ e.preventDefault(); setStep(step-1); }
});
if (new URLSearchParams(location.search).has('dark')) document.body.classList.add('dark');
if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
    && !new URLSearchParams(location.search).has('light')) document.body.classList.add('dark');
const h = location.hash.replace('#','');
setStep(/^\d+$/.test(h) ? (+h - 1) : 0);
</script>
</body>
</html>
